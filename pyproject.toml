[project]
name = "rag-home-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yeji-jang", email = "yejijang940@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.2.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "kiwipiepy>=0.25.1",
    "langchain>=1.5.2",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "selenium>=4.53.0",
    "streamlit>=1.40",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-home-api = "rag_home_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
